# Hébergement Netlify (formulaire de devis géré par Netlify Forms).
# Version de travail : `npm run build` (site non indexé, éléments à confirmer visibles).
# Mise en ligne réelle : remplacer par `npm run build:production` une fois les informations complètes.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
